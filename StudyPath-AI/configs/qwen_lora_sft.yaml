### Model
model_name_or_path: pretrained/Qwen2.5-7B-Instruct

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj

### Dataset
dataset_dir: data/processed
dataset: studypath_sft
template: qwen
cutoff_len: 2048
max_samples: 2000
overwrite_cache: true
preprocessing_num_workers: 4

### Output
output_dir: model/lora
logging_steps: 10
save_steps: 200
save_total_limit: 2
plot_loss: true

### Train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 2e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
flash_attn: fa2

### Eval（训练末做一轮）
val_size: 0.1
eval_strategy: steps
eval_steps: 200
