<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#047857"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:700;fill:#0F172A;}
      .sub{font-size:15px;fill:#64748B;}
      .stage-h{font-size:18px;font-weight:700;fill:#FFFFFF;}
      .stage-t{font-size:13px;fill:#E2E8F0;}
      .stage-p{font-size:12px;fill:#CBD5E1;font-weight:700;}
      .lg-h{font-size:17px;font-weight:700;fill:#065F46;}
      .node-h{font-size:14px;font-weight:700;fill:#064E3B;}
      .node-t{font-size:11px;fill:#047857;}
      .node-hw{font-size:14px;font-weight:700;fill:#FFFFFF;}
      .node-tw{font-size:11px;fill:#D1FAE5;}
      .tech{font-size:12px;fill:#334155;}
      .tech-h{font-size:12px;font-weight:700;fill:#0F172A;}
      .note{font-size:12px;fill:#065F46;}
      .mini{font-size:10px;fill:#059669;}
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1280" height="850" fill="#F8FAFC"/>

  <!-- 标题 -->
  <text x="40" y="48" class="title">StudyPath · 留学申请智能规划助手</text>
  <text x="40" y="72" class="sub">全流程大模型项目架构 — 数据标注 → 模型微调 → 应用开发 → N8N 自动化</text>

  <!-- ===== 四阶段卡片 ===== -->
  <!-- 阶段一 -->
  <rect x="40" y="100" width="280" height="150" rx="12" fill="#3B82F6"/>
  <text x="60" y="130" class="stage-h">阶段一 · 数据标注</text>
  <text x="60" y="156" class="stage-t">工具：openpyxl + 自写标注脚本</text>
  <text x="60" y="178" class="stage-t">· 三库采集 180 条真实数据</text>
  <text x="60" y="200" class="stage-t">· 字段归一化 + 5 维标注</text>
  <text x="60" y="222" class="stage-t">· 构造 Alpaca SFT 数据集</text>
  <text x="60" y="242" class="stage-p">产出：180 条 SFT（144 / 36）</text>

  <!-- 阶段二 -->
  <rect x="340" y="100" width="280" height="150" rx="12" fill="#8B5CF6"/>
  <text x="360" y="130" class="stage-h">阶段二 · 模型微调</text>
  <text x="360" y="156" class="stage-t">工具：LLaMA Factory + LoRA</text>
  <text x="360" y="178" class="stage-t">基座：Qwen2.5-7B-Instruct</text>
  <text x="360" y="200" class="stage-t">· rank8 / alpha16 / q,k,v,o_proj</text>
  <text x="360" y="222" class="stage-t">· AutoDL RTX 3090 · bf16 · fa2</text>
  <text x="360" y="242" class="stage-p">产出：LoRA 权重 20MB（51 步）</text>

  <!-- 阶段三 -->
  <rect x="640" y="100" width="280" height="150" rx="12" fill="#10B981"/>
  <text x="660" y="130" class="stage-h">阶段三 · 应用开发</text>
  <text x="660" y="156" class="stage-t">LangChain 1.x + LangGraph</text>
  <text x="660" y="178" class="stage-t">· RAG 三库检索（Chroma + MMR）</text>
  <text x="660" y="200" class="stage-t">· Supervisor + 3 Worker 编排</text>
  <text x="660" y="222" class="stage-t">· Gradio 本地驾驶舱 Demo</text>
  <text x="660" y="242" class="stage-p">产出：可运行 Demo</text>

  <!-- 阶段四 -->
  <rect x="940" y="100" width="280" height="150" rx="12" fill="#F59E0B"/>
  <text x="960" y="130" class="stage-h">阶段四 · N8N 自动化</text>
  <text x="960" y="156" class="stage-t">工具：n8n（本地 docker）</text>
  <text x="960" y="178" class="stage-t">· HTTP 调用 Dify Chatflow API</text>
  <text x="960" y="200" class="stage-t">· 解析响应 answer 字段</text>
  <text x="960" y="222" class="stage-t">· 飞书消息推送</text>
  <text x="960" y="242" class="stage-p">产出：对话 → 推送闭环</text>

  <!-- 阶段连接箭头 -->
  <line x1="320" y1="175" x2="338" y2="175" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="620" y1="175" x2="638" y2="175" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="920" y1="175" x2="938" y2="175" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== 阶段三 LangGraph 多智能体放大图 ===== -->
  <rect x="40" y="280" width="1180" height="315" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="64" y="314" class="lg-h">阶段三核心 · LangGraph 多智能体编排（串行链 + 条件执行）</text>

  <!-- Supervisor -->
  <rect x="80" y="410" width="150" height="105" rx="10" fill="#065F46"/>
  <text x="155" y="450" text-anchor="middle" class="node-hw">Supervisor</text>
  <text x="155" y="474" text-anchor="middle" class="node-tw">LLM 路由决策</text>
  <text x="155" y="494" text-anchor="middle" class="node-tw">决定激活哪些专家</text>

  <!-- 3 Workers（串行） -->
  <rect x="300" y="336" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="425" y="364" text-anchor="middle" class="node-h">选校策略师 · school</text>
  <text x="425" y="388" text-anchor="middle" class="node-t">检索院校项目库 → 冲 / 稳 / 保 梯度建议</text>

  <rect x="300" y="424" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="425" y="452" text-anchor="middle" class="node-h">录取风险评估师 · admission</text>
  <text x="425" y="476" text-anchor="middle" class="node-t">检索录取案例库 → 背景匹配与风险点</text>

  <rect x="300" y="512" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
  <text x="425" y="540" text-anchor="middle" class="node-h">文书规划师 · essay</text>
  <text x="425" y="564" text-anchor="middle" class="node-t">检索文书范例库 → 文书类型与写作要点</text>

  <!-- Synthesizer -->
  <rect x="620" y="410" width="170" height="105" rx="10" fill="#065F46"/>
  <text x="705" y="450" text-anchor="middle" class="node-hw">Synthesizer</text>
  <text x="705" y="474" text-anchor="middle" class="node-tw">汇总三份业务结论</text>
  <text x="705" y="494" text-anchor="middle" class="node-tw">全局统一编号来源卡片</text>

  <!-- 连接箭头（串行链） -->
  <line x1="230" y1="450" x2="296" y2="378" stroke="#047857" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <line x1="425" y1="412" x2="425" y2="422" stroke="#047857" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <line x1="425" y1="500" x2="425" y2="510" stroke="#047857" stroke-width="2.5" marker-end="url(#arrowG)"/>
  <line x1="550" y1="545" x2="616" y2="480" stroke="#047857" stroke-width="2.5" marker-end="url(#arrowG)"/>

  <text x="432" y="421" class="mini">串行</text>
  <text x="432" y="509" class="mini">串行</text>
  <text x="150" y="530" class="mini">route 未命中的 worker 直接跳过</text>

  <!-- 右侧数据流标注 -->
  <text x="830" y="346" class="note">知识库：Chroma 向量库（本地持久化）</text>
  <text x="830" y="370" class="note">180 条：院校 100 / 案例 50 / 文书 30</text>
  <text x="830" y="398" class="tech" fill="#065F46">嵌入：DashScope text-embedding-v3</text>
  <text x="830" y="422" class="tech" fill="#065F46">检索：MMR（k=8, fetch_k=20）</text>
  <text x="830" y="446" class="tech" fill="#065F46">生成：DashScope qwen-plus</text>
  <text x="830" y="470" class="tech" fill="#065F46">微调：LoRA adapter 20MB（离线验收）</text>
  <text x="830" y="498" class="tech" fill="#065F46">输出：选校方案 + 风险结论 + 文书要点</text>

  <!-- ===== 底部技术栈 ===== -->
  <rect x="40" y="618" width="1180" height="104" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="60" y="646" class="tech-h">RAG 内核层：</text>
  <text x="150" y="646" class="tech">LangChain 1.x（DocumentLoader / Splitter / Embeddings 接入 / VectorStore 封装 / 检索链 / Prompt 模板）</text>
  <text x="60" y="674" class="tech-h">编排层：</text>
  <text x="122" y="674" class="tech">LangGraph（StateGraph 手写 Supervisor–Worker–Synthesizer）· Chroma 向量库 · Gradio（本地成品展示层）</text>
  <text x="60" y="702" class="tech-h">工程链路：</text>
  <text x="134" y="702" class="tech">LLaMA Factory（LoRA 领域微调）· Dify（低代码应用层 MVP）· N8N（自动化编排层）· AutoDL（云端训练）</text>

  <text x="640" y="760" text-anchor="middle" class="sub">数据全部来源于学校官网 / QS·USNews 排名 / 一亩三分地等公开渠道，每条记录带 source_url，真实可溯源</text>
</svg>
